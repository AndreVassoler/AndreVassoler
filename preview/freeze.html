<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>freeze</title>
    <style>
      body { margin: 0; background: #0d1117; display: flex; justify-content: center; align-items: flex-start; padding: 16px; }
      #stage svg { display: block; }
      #hud { position: fixed; top: 4px; left: 8px; color: #8b949e; font: 12px monospace; }
    </style>
  </head>
  <body>
    <div id="hud">loading…</div>
    <div id="stage"></div>
    <script>
      const p = new URLSearchParams(location.search);
      const theme = p.get("theme") === "dark" ? "-dark" : "";
      const t = parseFloat(p.get("t") || "0");
      fetch("../dist/mario-contribution" + theme + ".svg")
        .then((r) => r.text())
        .then((txt) => {
          document.getElementById("stage").innerHTML = txt;
          requestAnimationFrame(() => {
            const anims = document.getAnimations();
            anims.forEach((a) => {
              try {
                a.pause();
                a.currentTime = t;
              } catch (e) {}
            });
            document.getElementById("hud").textContent = "frozen @ " + t + "ms · anims=" + anims.length + " · theme=" + (theme || "light");
          });
        });
    </script>
  </body>
</html>
