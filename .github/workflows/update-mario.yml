name: Update Mario Banner

on:
  schedule:
    - cron: "0 0 * * *" # Roda todo dia as 00:00 (UTC)
  workflow_dispatch: # Permite disparo manual pela aba Actions

# Necessario para que a action consiga publicar na branch "output"
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # 1) Snake (mantido como alternativa recolhivel no README).
      # IMPORTANTE: a action de publicacao (crazy-max/ghaction-github-pages)
      # SUBSTITUI o conteudo da branch "output" pelo build_dir. Por isso o
      # snake e o mario sao gerados na MESMA pasta dist/ e publicados juntos
      # num unico passo -- caso contrario um workflow apagaria os SVGs do outro.
      # -------------------------------------------------------------------
      - name: Gerar animacao do Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # -------------------------------------------------------------------
      # 2) Mario (gerador proprio em scripts/generate-mario.ts).
      # github.repository_owner = dono do repo (ex.: AndreVassoler).
      # GITHUB_TOKEN e usado para ler as contribuicoes via API GraphQL.
      # -------------------------------------------------------------------
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Gerar o SVG do Mario
        run: >
          npx tsx scripts/generate-mario.ts
          "${{ github.repository_owner }}"
          "dist/mario-contribution.svg"
          "dist/mario-contribution-dark.svg?theme=dark"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------------------
      # 3) Publica TODOS os SVGs (snake + mario) juntos na branch "output".
      # O README aponta para os arquivos via raw.githubusercontent.com/.../output/...
      # -------------------------------------------------------------------
      - name: Publicar banners na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ---------------------------------------------------------------------------
# ALTERNATIVA (action externa): caso o gerador do Mario seja publicado como
# uma action reutilizavel (ex.: usuario/github-readme-mario), o passo de
# geracao acima poderia ser substituido por algo como:
#
#   - name: Gerar o SVG do Mario (via action)
#     uses: AndreVassoler/github-readme-mario@master
#     with:
#       github_user_name: ${{ github.repository_owner }}
#       outputs: |
#         dist/mario-contribution.svg
#         dist/mario-contribution-dark.svg?theme=dark
#
# Mantemos a versao "self-contained" (npx tsx) como padrao por ser totalmente
# funcional sem depender de uma action publicada externamente.
# ---------------------------------------------------------------------------
